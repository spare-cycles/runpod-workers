name: build-transcribe

# Build and push the **transcription** worker image to GHCR.
# Tags: a `transcribe-v1.2.3` tag push -> :1.2.3 + :latest; any main push -> :main + :sha-<short>.
#
# 🔴 **The image name is hard-coded, and must stay that way — the repo name no longer matches it.**
# It used to read `ghcr.io/${{ github.repository }}`, which was correct while this repo was called
# `transcribe-worker`. Since the 2026-08-03 rename that expression resolves to
# `ghcr.io/spare-cycles/runpod-workers` — a *different* package from the one
# `iac-platform`'s `runpod/transcribe.yaml` pins by digest, so the endpoint would go on serving the
# old image while every build here published somewhere nothing reads. The second worker that
# motivated the rename is gone (2026-08-04) and this hazard is not: the repo is still
# `runpod-workers` and the package is still `transcribe-worker`.
#
# ⚠️ **A GHCR package links to its repository at FIRST publish, by repository id, and there is no
# API to fix it later.** An unlinked package cannot be written by a workflow's `GITHUB_TOKEN` — the
# push dies with `403 Forbidden`, and pushing again *with* `org.opencontainers.image.source` set
# does not retrofit the link.
#
# This package was first published when this repository was called `transcribe-worker`. It kept
# working across the 2026-08-03 rename to `runpod-workers` because a rename **preserves the
# repository id** (`1321244198` before and after) and does not touch package names — which is
# precisely why the second worker was reached by renaming rather than by creating a second repo. A
# new repo would have 403'd here until someone fixed it in the UI: Package settings →
# Manage Actions access → Add Repository, role **Write**.
#
# Either way it cannot break transcription: `transcribe.yaml` pins the image **by digest**, so a
# build that never publishes leaves the running endpoint exactly where it is.
on:
  push:
    branches: [main]
    tags: ["transcribe-v*"]
    paths:
      - "transcribe/**"
      - "tests/**"
      - "bench.py"
      - "pyproject.toml"
      - ".github/workflows/docker-transcribe.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/spare-cycles/transcribe-worker

jobs:
  # The same gate `ci.yml` runs, restated rather than reached for with `workflow_call`. It exists so
  # `needs: check` can gate publication: a workflow cannot depend on a job in another workflow, and
  # nothing else stops a red tree from being tagged `:latest`.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # `mistral-common[audio]` is what makes `test_voxtral.py` run rather than skip — it builds the
      # real Voxtral request and checks it against the OpenAI SDK's argument list. Skipping it here
      # would let the gate that publishes the image be weaker than the one on the pull request.
      - run: pip install ruff pytest openai 'mistral-common[audio]'
      - run: ruff check .
      - run: ruff format --check .
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pytest -q

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/transcribe-v') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v6
        with:
          # The repo root, not `transcribe/`, because the image also needs the top-level `bench.py`.
          # The Dockerfile's COPY paths are written against this context, not against its own
          # directory — a mismatch there fails the build outright, which is the good outcome.
          context: .
          file: transcribe/Dockerfile
          # amd64 only: every GPU this targets is x86, and the vLLM base image's aarch64 variant
          # carries a different CUDA pairing that nothing here has been tested against.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=transcribe
          cache-to: type=gha,mode=max,scope=transcribe

      # The RunPod endpoint spec in iac-platform pins this image **by digest**, never by tag, so the
      # digest is what a deploy actually needs. Printed here rather than looked up by hand later.
      - run: echo "::notice title=Image digest::${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
