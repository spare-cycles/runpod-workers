name: ci

# The quality gate on pull requests, where no image is built.
#
# One suite for the whole repo, not one per worker. The workers share `common/`, so a change there
# has to be proved against both — and a per-worker gate would let a `common/` edit land green
# because only the worker whose directory it touched was tested.
#
# `docker-transcribe.yml` and `docker-coding.yml` each restate this same job as their own `check`
# before publishing anything — see the note in the first of those for why the duplication is worth
# it and not a shared workflow.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff pytest
      - run: ruff check .
      - run: ruff format --check .
      # ffmpeg is a real dependency of the audio tests: they build Ogg/Opus fixtures with it and
      # convert them back, rather than asserting that the code calls a mock the way its author
      # imagined ffmpeg behaves. Installed after the lint gate so the fast check fails first.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # No vLLM, no torch, no GPU and no RunPod SDK. Every heavy import in this package sits inside
      # the branch that needs it, which is what lets the request contract be tested on a CPU runner.
      #
      # `mistral-common[audio]` is here for `test_voxtral.py` and is worth its install time: the
      # Voxtral request is built entirely from that library's symbols and serialised against the
      # OpenAI SDK's argument list, and neither is reachable from a test that fakes the backend. Two
      # bugs — a moved import and a field `transcriptions.create` will not accept — reached a rented
      # A100 because nothing on a CPU runner had ever constructed the real request. It pulls numpy
      # and soundfile, not torch.
      - run: pip install openai pytest 'mistral-common[audio]'
      - run: pytest -q
