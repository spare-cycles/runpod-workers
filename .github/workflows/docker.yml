name: build-image

# Build and push the transcribe-worker image to GHCR.
# Tags: a semver tag push (v1.2.3) -> :1.2.3 + :latest; any main push -> :main + :sha-<short>.
#
# ⚠️ **A GHCR package links to its repository at FIRST publish and there is no API to fix it later.**
# The link comes from `org.opencontainers.image.source` on the image config, or from having been
# created by Actions. Pushing an already-existing package again *with* the label does not retrofit
# it, and an unlinked package cannot be written by a workflow's `GITHUB_TOKEN` — the push dies with
# `403 Forbidden`. If that happens, fix it in the UI: Package settings → Manage Actions access →
# Add Repository, role **Write**.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The same gate `ci.yml` runs, restated rather than reached for with `workflow_call`. It exists so
  # `needs: check` can gate publication: a workflow cannot depend on a job in another workflow, and
  # nothing else stops a red tree from being tagged `:latest`.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # `mistral-common[audio]` is what makes `test_voxtral.py` run rather than skip — it builds the
      # real Voxtral request and checks it against the OpenAI SDK's argument list. Skipping it here
      # would let the gate that publishes the image be weaker than the one on the pull request.
      - run: pip install ruff pytest openai 'mistral-common[audio]'
      - run: ruff check .
      - run: ruff format --check .
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pytest -q

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only: every GPU this targets is x86, and the vLLM base image's aarch64 variant
          # carries a different CUDA pairing that nothing here has been tested against.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The RunPod endpoint spec in iac-platform pins this image **by digest**, never by tag, so the
      # digest is what a deploy actually needs. Printed here rather than looked up by hand later.
      - run: echo "::notice title=Image digest::${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
